<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; media-src 'self' file: data:; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Live Wallpaper</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #wallpaper-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            background: #000;
        }
    </style>
</head>
<body>
    <video id="wallpaper-video" autoplay playsinline></video>
    <script src="js/wallpaper.js"></script>
</body>
</html>

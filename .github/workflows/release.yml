name: Build and release

# Pushing to main never publishes anything. A release is created only from a version tag (v5.0.0, ...)
# and is created as a DRAFT, so it can be checked before it reaches the auto-updater.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:preload
      # The engine suites exercise the real ffmpeg, sharp and document converters on each operating system.
      - name: Engine tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a node scripts/run-tests.js
      - name: Engine tests
        if: runner.os != 'Linux'
        run: node scripts/run-tests.js

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,   os: windows-latest,  args: '--win',         experimental: false }
          - { name: linux,     os: ubuntu-latest,   args: '--linux',       experimental: false }
          - { name: mac-arm64, os: macos-latest,    args: '--mac --arm64', experimental: false }
          - { name: mac-x64,   os: macos-15-intel,  args: '--mac --x64',   experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"; exit 1; fi

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2 fakeroot

      - run: npm ci
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Run the real packaged app headless: real conversions with every bundled library, from the built files.
      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:UFC_USER_DATA = Join-Path $env:RUNNER_TEMP 'ufc-data'
          $env:UFC_SELFTEST = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $exe = (Resolve-Path 'dist/win-unpacked/Universal File Converter.exe').Path
          $p = Start-Process -FilePath $exe -PassThru -Wait
          Get-Content $env:UFC_SELFTEST
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          export UFC_USER_DATA="$RUNNER_TEMP/ufc-data" UFC_SELFTEST="$RUNNER_TEMP/selftest.json"
          xvfb-run -a dist/linux-unpacked/uni-companion --no-sandbox
          cat "$UFC_SELFTEST"
      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          export UFC_USER_DATA="$RUNNER_TEMP/ufc-data" UFC_SELFTEST="$RUNNER_TEMP/selftest.json"
          app="$(ls -d dist/mac*/"Uni Companion.app" | head -n 1)"
          "$app/Contents/MacOS/Uni Companion"
          cat "$UFC_SELFTEST"

      - name: List what was built
        shell: bash
        run: ls -la dist | grep -E "\.(exe|dmg|zip|AppImage|deb|yml|blockmap)$" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ufc-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather release files
        run: |
          mkdir -p release-assets
          # Alphabetical order puts the Apple Silicon update manifest first; the first copy of a name wins.
          for dir in artifacts/*; do cp -n "$dir"/* release-assets/ 2>/dev/null || true; done
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Universal File Converter ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release-assets/*
          draft: true
          prerelease: false
